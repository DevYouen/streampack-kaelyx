# Publie une nouvelle version : change "version" dans package.json, puis
#   git commit -am "v1.0.1" && git tag v1.0.1 && git push && git push --tags
# GitHub construit l'installateur et le met dans Releases ; les applications installées le récupèrent seules.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
