# Publie une nouvelle version : change "version" dans package.json, puis
#   git commit -am "v1.0.1" && git tag v1.0.1 && git push && git push --tags
# GitHub construit l'installateur et le met dans Releases ; les applications installées le récupèrent seules.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # La release est créée d'abord (en brouillon) : sinon electron-builder envoie ses fichiers en parallèle
      # et peut créer deux releases avec le même tag, ce qui casse le lien de téléchargement.
      - run: gh release create ${{ github.ref_name }} --draft --title ${{ github.ref_name }} --notes "Mise à jour automatique."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Publiée seulement quand tous les fichiers sont là : les applications ne voient jamais une version incomplète
      - run: gh release edit ${{ github.ref_name }} --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
