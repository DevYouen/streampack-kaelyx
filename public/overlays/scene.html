<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Scène — Kaelyx</title>
<link rel="stylesheet" href="/css/kx.css">
<style>
  /* Fond : anthracite, halo violet, rayons lents, grille légère, nom d'équipe géant en filigrane, bandes obliques */
  .bg { position: absolute; inset: 0; background: var(--kx-bg); overflow: hidden; }
  .silk { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0; transition: opacity 1.6s ease; }
  .silk.on { opacity: 1; }
  .silk.on ~ .halo { display: none; }
  .halo { position: absolute; width: 1400px; height: 1400px; left: var(--hx, 1340px); top: 50%; margin: -700px 0 0 -700px; border-radius: 50%;
    background: radial-gradient(circle, rgba(153,51,204,.42) 0%, rgba(86,28,115,.32) 30%, rgba(86,28,115,0) 64%); animation: kx-pulse 8s ease-in-out infinite; }
  .grid-bg { position: absolute; inset: 0; opacity: .5;
    background-image: linear-gradient(rgba(201,204,209,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(201,204,209,.05) 1px, transparent 1px);
    background-size: 80px 80px; animation: sGrid 50s linear infinite;
    -webkit-mask-image: radial-gradient(ellipse 70% 80% at 70% 50%, #000, transparent); mask-image: radial-gradient(ellipse 70% 80% at 70% 50%, #000, transparent); }
  @keyframes sGrid { to { background-position: 80px 80px; } }
  #stars { position: absolute; inset: 0; opacity: .55; }
  /* Nom d'équipe géant, en contour très léger, qui défile lentement en bas de l'écran */
  .ghost { position: absolute; left: 0; bottom: 18px; display: flex; white-space: nowrap; pointer-events: none; animation: sGhost 90s linear infinite; }
  .ghost span { font: italic 900 250px/1 var(--f-title); text-transform: uppercase; letter-spacing: .02em; padding-right: 80px; color: transparent;
    -webkit-text-stroke: 2px rgba(201,204,209,.075); }
  @keyframes sGhost { to { transform: translateX(-50%); } }
  .band { position: absolute; width: 180px; height: 1700px; top: -300px; background: var(--kx-grad); transform: rotate(24deg); opacity: .9; overflow: hidden; }
  .band.thin { width: 24px; opacity: .55; }
  .band.hair { width: 4px; opacity: .5; background: var(--kx-silver); }
  .band::after { content: ''; position: absolute; left: 0; right: 0; height: 280px; top: -320px;
    background: linear-gradient(transparent, rgba(243,241,241,.5), transparent); animation: sSheen 7s ease-in-out infinite; }
  .band.thin::after { animation-delay: 1.4s; } .band.hair::after { animation-delay: 2.4s; }
  @keyframes sSheen { 0%, 40% { top: -320px; } 85%, 100% { top: 1900px; } }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 120% 90% at 60% 50%, rgba(42,43,44,0) 55%, rgba(42,43,44,.9) 100%); }
  .shine { position: absolute; top: -30%; bottom: -30%; left: -700px; width: 460px; transform: rotate(24deg); pointer-events: none;
    background: linear-gradient(90deg, rgba(243,241,241,0), rgba(243,241,241,.075), rgba(243,241,241,0)); animation: sShine 13s cubic-bezier(.45, 0, .25, 1) 4s infinite; }
  @keyframes sShine { 0% { left: -700px; } 28%, 100% { left: 2400px; } }

  /* Repères aux coins de l'écran */
  .corner { position: absolute; width: 46px; height: 46px; border: 0 solid rgba(201,204,209,.38); pointer-events: none; }
  .corner.tl { left: 40px; top: 40px; border-width: 2px 0 0 2px; } .corner.tr { right: 40px; top: 40px; border-width: 2px 2px 0 0; }
  .corner.bl { left: 40px; bottom: 40px; border-width: 0 0 2px 2px; } .corner.br { right: 40px; bottom: 40px; border-width: 0 2px 2px 0; }

  /* Bandeau du haut : équipe · ligne · heure */
  .top { position: absolute; left: 120px; right: 260px; top: 70px; display: flex; align-items: center; gap: 18px; }
  .top .claws { --h: 18px; }
  .top .t-label { color: var(--kx-white); font-size: 15px; letter-spacing: .3em; white-space: nowrap; }
  .top .t-label em { font-style: normal; color: var(--kx-violet); }
  .top-line { flex: 1; height: 1px; background: linear-gradient(90deg, rgba(201,204,209,.45), rgba(201,204,209,.08)); position: relative; overflow: hidden; }
  .top-line::after { content: ''; position: absolute; top: 0; height: 1px; width: 160px; left: -160px; background: linear-gradient(90deg, transparent, #F3F1F1, transparent); animation: sLine 6s ease-in-out infinite; }
  @keyframes sLine { 0%, 30% { left: -160px; } 100% { left: 100%; } }
  .clock { display: flex; align-items: center; gap: 12px; font: 700 15px/1 var(--f-body); letter-spacing: .24em; color: var(--kx-silver); white-space: nowrap; }
  .clock b { font: 800 30px/1 var(--f-title); letter-spacing: .04em; color: var(--kx-white); font-variant-numeric: tabular-nums; }
  .clock i { width: 8px; height: 8px; background: var(--kx-violet); transform: rotate(45deg); box-shadow: 0 0 10px var(--kx-violet); animation: kx-pulse 1s ease-in-out infinite; }

  /* Logo et son cadran */
  .mark { position: absolute; left: 1340px; top: 540px; width: 0; height: 0; perspective: 1400px; }
  .mark .glow { position: absolute; width: 760px; height: 760px; left: -380px; top: -380px; border-radius: 50%;
    background: radial-gradient(circle, rgba(153,51,204,.35), rgba(86,28,115,.12) 45%, transparent 68%); animation: sGlow 5s ease-in-out infinite; }
  @keyframes sGlow { 50% { transform: scale(1.08); opacity: .75; } }
  .mark .lg { position: absolute; width: 420px; height: 420px; left: -210px; top: -210px; animation: float3d 11s ease-in-out infinite; }
  @keyframes float3d { 0%, 100% { transform: translateY(0) rotateY(-11deg) rotateX(4deg); } 50% { transform: translateY(-14px) rotateY(11deg) rotateX(-4deg); } }
  .mark .logo { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 20px 40px rgba(18,18,20,.55)) drop-shadow(0 0 30px rgba(153,51,204,.35)); }
  /* Reflet qui passe sur la forme du logo (masque = le logo lui-même) */
  .mark .glint { position: absolute; inset: 0; -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center;
    background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.85) 50%, transparent 60%) no-repeat; background-size: 300% 100%; animation: sGlint 7s cubic-bezier(.45, 0, .2, 1) 1.2s infinite; }
  @keyframes sGlint { 0% { background-position: 130% 0; } 22%, 100% { background-position: -30% 0; } }
  .mark .ring { position: absolute; width: 620px; height: 620px; left: -310px; top: -310px; border-radius: 50%; border: 2px solid rgba(201,204,209,.14); }
  .mark .ring::after { content: ''; position: absolute; width: 12px; height: 12px; left: 50%; top: -7px; margin-left: -6px; background: var(--kx-violet); transform: rotate(45deg); box-shadow: 0 0 12px var(--kx-violet); }
  .mark .spin { position: absolute; inset: 0; animation: kx-spin 24s linear infinite; }
  .mark .dial { position: absolute; width: 820px; height: 820px; left: -410px; top: -410px; overflow: visible; animation: kx-spin 90s linear infinite reverse; }
  .mark .dial circle { fill: none; }
  .mark .inner { position: absolute; width: 500px; height: 500px; left: -250px; top: -250px; border-radius: 50%; border: 1px dashed rgba(201,204,209,.16); animation: kx-spin 60s linear infinite; }
  .mark .inner i { position: absolute; width: 8px; height: 8px; margin: -4px; background: var(--kx-silver); transform: rotate(45deg); opacity: .6; }
  .mark .inner i:nth-child(1) { left: 50%; top: 0; } .mark .inner i:nth-child(2) { left: 100%; top: 50%; }
  .mark .inner i:nth-child(3) { left: 50%; top: 100%; } .mark .inner i:nth-child(4) { left: 0; top: 50%; background: var(--kx-violet); opacity: 1; box-shadow: 0 0 10px var(--kx-violet); }
  @keyframes float { 50% { transform: translateY(-12px); } }
  /* Néon qui parcourt l'anneau autour du logo */
  .mark .neon-ring { position: absolute; width: 620px; height: 620px; left: -310px; top: -310px; overflow: visible; transform: rotate(-90deg); }
  .mark .neon-ring circle { --nd: 9s; }

  /* Texte */
  .copy { position: absolute; left: 120px; top: 0; bottom: 0; width: 860px; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  .kicker { display: flex; align-items: center; gap: 18px; }
  .kicker .t-label { font-size: 18px; color: var(--kx-white); letter-spacing: .22em; }
  .kicker .claws i { animation: sClaw 2.4s ease-in-out infinite; }
  .kicker .claws i:nth-child(2) { animation-delay: .2s; } .kicker .claws i:nth-child(3) { animation-delay: .4s; }
  @keyframes sClaw { 0%, 60%, 100% { filter: none; } 20% { filter: brightness(1.6) drop-shadow(0 0 6px #9933CC); } }
  .title { font-size: 170px; margin: 0; padding-right: 12px; filter: drop-shadow(0 10px 30px rgba(18,18,20,.35)) drop-shadow(0 0 34px rgba(153,51,204,.2)); }
  .title .w { display: inline-block; overflow: hidden; vertical-align: top; padding: .16em .14em 0 0; margin: -.16em -.14em 0 0; }
  .title .ch { display: inline-block; }
  .title .last .ch { color: var(--kx-violet); }
  .title .ch { animation: chWave 11s ease-in-out infinite; animation-delay: calc(3.5s + var(--i) * 45ms); }
  @keyframes chWave { 0%, 7%, 100% { transform: none; filter: none; } 3.5% { transform: translateY(-5px); filter: brightness(1.3) drop-shadow(0 0 14px rgba(153,51,204,.95)); } }
  .sub { font: 500 26px/1.4 var(--f-body); color: var(--kx-silver); margin: 0; max-width: 700px; padding-left: 18px; border-left: 3px solid var(--kx-violet); }

  /* Compte à rebours : chiffres façon panneau, MIN / SEC, barre de progression */
  .count { display: flex; flex-direction: column; gap: 14px; width: max-content; }
  .cd { display: flex; align-items: flex-start; gap: 14px; filter: var(--kx-shadow); }
  .cd-grp { display: flex; flex-direction: column; gap: 10px; }
  .digits { display: flex; gap: 6px; }
  .digit { position: relative; width: 108px; height: 132px; perspective: 520px; clip-path: polygon(12px 0, 100% 0, 100% 100%, 0 100%, 0 12px); }
  .digit .h { position: absolute; left: 0; right: 0; height: 50%; overflow: hidden; backface-visibility: hidden; }
  .digit .h b { position: absolute; left: 0; right: 0; height: 132px; font: 800 104px/132px var(--f-title); text-align: center; font-variant-numeric: tabular-nums; }
  .digit .up, .digit .fu { top: 0; background: linear-gradient(180deg, rgba(243,241,241,.11), rgba(243,241,241,.03)), var(--kx-panel); box-shadow: inset 0 1px 0 rgba(243,241,241,.12); }
  .digit .dn, .digit .fd { bottom: 0; background: linear-gradient(180deg, rgba(0,0,0,.24), rgba(0,0,0,0) 60%), var(--kx-panel); box-shadow: inset 0 -4px 0 var(--kx-violet); }
  .digit .up b, .digit .fu b { top: 0; } .digit .dn b, .digit .fd b { top: -66px; }
  .digit .fu { transform-origin: 50% 100%; z-index: 2; }
  .digit .fd { transform-origin: 50% 0; transform: rotateX(90deg); z-index: 2; }
  .digit::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: rgba(18,18,20,.75); z-index: 3; }
  .digit.flip .fu { animation: fFu .28s cubic-bezier(.55, 0, 1, .45) both; }
  .digit.flip .fd { animation: fFd .34s cubic-bezier(0, .55, .45, 1) .28s both; }
  @keyframes fFu { from { transform: rotateX(0); filter: brightness(1); } to { transform: rotateX(-90deg); filter: brightness(.5); } }
  @keyframes fFd { from { transform: rotateX(90deg); filter: brightness(1.6); } to { transform: rotateX(0); filter: brightness(1); } }
  .cd-l { font: 700 13px/1 var(--f-body); letter-spacing: .4em; color: var(--kx-silver); padding-left: 4px; }
  .colon { display: flex; flex-direction: column; gap: 22px; padding-top: 40px; }
  .colon i { width: 12px; height: 12px; background: var(--kx-violet); transform: rotate(45deg); box-shadow: 0 0 12px var(--kx-violet); animation: kx-pulse 1s ease-in-out infinite; }
  .cd-bar { position: relative; height: 4px; background: rgba(201,204,209,.16); }
  .cd-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--kx-grad); box-shadow: 0 0 12px rgba(153,51,204,.8); transition: width 1s linear; }
  .cd-bar i::after { content: ''; position: absolute; right: -4px; top: -4px; width: 12px; height: 12px; background: var(--kx-white); transform: rotate(45deg); box-shadow: 0 0 14px var(--kx-violet); }
  .count.final .digit .up, .count.final .digit .fu { background: linear-gradient(180deg, rgba(243,241,241,.16), rgba(243,241,241,.04)), #561C73; }
  .count.final .digit .dn, .count.final .digit .fd { background: linear-gradient(180deg, rgba(0,0,0,.22), rgba(0,0,0,0) 60%), #561C73; box-shadow: inset 0 -4px 0 #F3F1F1; }
  .count.final .cd { animation: cdBeat 1s cubic-bezier(.16, 1, .3, 1) infinite; }
  @keyframes cdBeat { 0% { transform: scale(1.045); filter: drop-shadow(0 0 26px rgba(153,51,204,.8)); } 60%, 100% { transform: none; filter: drop-shadow(0 12px 28px rgba(18,18,20,.45)); } }
  .count.final .cd-bar i { background: linear-gradient(90deg, #9933CC, #F3F1F1); box-shadow: 0 0 18px rgba(243,241,241,.7); }
  .count.final .cd-l { color: var(--kx-white); }
  .done { font-size: 100px; padding-right: 12px; animation: sDone .9s var(--kx-out) both; text-shadow: 0 0 40px rgba(153,51,204,.6); }
  @keyframes sDone { 0% { opacity: 0; transform: scale(1.25); filter: blur(10px) brightness(2); } 100% { opacity: 1; transform: none; filter: none; } }

  .next { position: relative; overflow: hidden; display: inline-flex; align-items: stretch; height: 56px; width: max-content; filter: var(--kx-shadow); }
  .next b { display: flex; align-items: center; gap: 10px; padding: 0 22px; background: var(--kx-grad); font: 800 13px/1 var(--f-body); letter-spacing: .18em; text-transform: uppercase; }
  .next b em { font-style: normal; font-size: 18px; animation: sChev 1.6s ease-in-out infinite; }
  @keyframes sChev { 50% { transform: translateX(4px); opacity: .6; } }
  .next span { display: flex; align-items: center; padding: 0 34px 0 22px; background: var(--kx-panel); font: 600 23px/1 var(--f-body); box-shadow: inset 0 -2px 0 rgba(153,51,204,.6);
    clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 100%, 0 100%); }
  .next::after { content: ''; position: absolute; top: 0; bottom: 0; width: 90px; left: -120px; background: linear-gradient(100deg, transparent, rgba(243,241,241,.22), transparent); animation: sNext 5s ease-in-out 2s infinite; }
  @keyframes sNext { 0%, 60% { left: -120px; } 100% { left: 110%; } }
  .socials { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 18px; }
  .soc { display: flex; align-items: center; gap: 12px; padding-right: 18px; font: 600 20px/1 var(--f-body); color: var(--kx-white); background: rgba(42,43,44,.55); box-shadow: inset 0 0 0 1px rgba(201,204,209,.12); }
  .soc svg { box-sizing: content-box; padding: 9px; color: var(--kx-white); background: var(--kx-deep); box-shadow: inset 0 -2px 0 var(--kx-violet); }

  #ticker { position: absolute; left: 0; bottom: 0; width: 1920px; height: 64px; border: 0; }
  .goal { width: 620px; margin-top: 22px; }
  .goal .gh { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .goal .gh b { font: italic 800 26px/1 var(--f-title); text-transform: uppercase; }
  .goal .gh span { font: 800 26px/1 var(--f-title); font-variant-numeric: tabular-nums; } .goal .gh em { font-style: normal; color: var(--kx-silver); }
  .goal .gt { height: 14px; background: rgba(201,204,209,.18); clip-path: polygon(0 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
  .goal .gt i { display: block; height: 100%; background: var(--kx-grad); box-shadow: inset -4px 0 0 var(--kx-white); transition: width 1.2s cubic-bezier(.16, 1, .3, 1); }

  /* Just chatting */
  .chat-cam, .chat-box { position: absolute; }
  .chat-head { position: absolute; left: 64px; top: 52px; display: flex; align-items: center; gap: 20px; }
  .chat-head h1 { font-size: 72px; margin: 0; padding-right: 10px; }
  .chat-head img { width: 72px; height: 72px; object-fit: contain; filter: drop-shadow(0 0 14px rgba(153,51,204,.5)); }
  .chat-box .panel { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(86,28,115,.25), rgba(42,43,44,0) 30%), rgba(42,43,44,.7); }
  .chat-box iframe { position: absolute; left: 10px; right: 10px; top: 16px; bottom: 10px; width: calc(100% - 20px); height: calc(100% - 26px); border: 0; }
  .chat-box .kx-frame { z-index: 2; }
  .chat-top { position: absolute; right: 64px; top: 70px; display: flex; align-items: center; gap: 22px; }
  .tab { position: absolute; display: inline-flex; align-items: center; gap: 10px; height: 34px; padding: 0 16px; font: 800 13px/1 var(--f-body); letter-spacing: .2em; text-transform: uppercase;
    background: var(--kx-grad); clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); filter: var(--kx-shadow); z-index: 3; }
  .tab i { width: 8px; height: 8px; border-radius: 50%; background: var(--kx-white); animation: sLive 1.6s ease-out infinite; }
  @keyframes sLive { 0% { box-shadow: 0 0 0 0 rgba(243,241,241,.9); } 100% { box-shadow: 0 0 0 8px rgba(243,241,241,0); } }
  .tab svg { width: 16px; height: 16px; }

  /* Entrée */
  .enter .copy > * { animation: kx-rise .8s var(--kx-out) both; }
  .enter .copy > *:nth-child(2) { animation-delay: .07s; } .enter .copy > *:nth-child(3) { animation-delay: .14s; }
  .enter .copy > *:nth-child(4) { animation-delay: .21s; } .enter .copy > *:nth-child(5) { animation-delay: .28s; }
  .enter .copy > .title { animation: none; }
  .enter .title .ch { animation: chIn .85s var(--kx-out) both, chWave 11s ease-in-out infinite; animation-delay: calc(.12s + var(--i) * 32ms), calc(3.5s + var(--i) * 45ms); }
  @keyframes chIn { from { transform: translateY(106%) skewX(-12deg); } to { transform: none; } }
  .enter .top { animation: sTop .9s var(--kx-out) .2s both; }
  @keyframes sTop { from { opacity: 0; clip-path: inset(0 100% 0 0); } to { opacity: 1; clip-path: inset(-20px -20px -20px 0); } }
  .enter .mark .lg { animation: sLogo 1.1s var(--kx-out) .15s both, float3d 11s ease-in-out 1.3s infinite; }
  @keyframes sLogo { from { opacity: 0; transform: scale(.82); filter: blur(14px); } to { opacity: 1; transform: none; filter: none; } }
  .enter .mark .ring { animation: sRingIn 1.2s var(--kx-out) both; }
  .enter .mark .dial { animation: sRingIn 1.4s var(--kx-out) .1s both, kx-spin 90s linear infinite reverse; }
  .enter .mark .inner { animation: sRingIn 1.3s var(--kx-out) .05s both, kx-spin 60s linear infinite; }
  .chatting .corner { display: none; }
  @keyframes sRingIn { from { opacity: 0; scale: .7; } to { opacity: 1; scale: 1; } }
  .enter .chat-cam, .enter .chat-box { animation: kx-rise .8s var(--kx-out) both; } .enter .chat-box { animation-delay: .1s; }
</style>
</head>
<body class="overlay">
<div class="bg" id="bg">
  <canvas class="silk" id="silk"></canvas>
  <div class="halo"></div>
  <div class="grid-bg"></div>
  <canvas id="stars"></canvas>
  <div class="ghost" id="ghost"></div>
  <div class="band" style="left:1720px"></div>
  <div class="band thin" style="left:1660px"></div>
  <div class="band hair" style="left:1610px"></div>
  <div class="vignette"></div>
  <i class="shine"></i>
  <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
</div>
<div id="root"></div>
<iframe id="ticker" scrolling="no" style="display:none"></iframe>
<script src="/js/kx.js"></script>
<script src="/js/kx-fx.js"></script>
<script>
const type = location.pathname.split('/')[2] || 'starting';
KX.starfield(document.getElementById('stars'), 120);
const silk = KXFX.silk(document.getElementById('silk'), { focus: [(type === 'chatting' ? 1600 : 1340) / 1920, .5], strength: type === 'chatting' ? .8 : 1 });
const SILK_BASE = type === 'chatting' ? .8 : 1;
let lastKey = '';

const CAM = { x: 64, y: 168, w: 1200, h: 675 };
const CHAT = { x: 1328, y: 168, w: 528, h: 840 };

// Le dernier mot passe à la ligne, en violet ; chaque lettre est animée séparément (montée depuis un masque)
function titleHTML(t) {
  const words = String(t || '').split(' ').filter(Boolean);
  let i = 0;
  const word = w => `<span class="w">${[...w].map(c => `<span class="ch" style="--i:${i++}">${KX.esc(c)}</span>`).join('')}</span>`;
  if (words.length < 2) return words.map(word).join(' ');
  const last = words.pop();
  return words.map(word).join(' ') + '<br><span class="last">' + word(last) + '</span>';
}
// Barre d'objectif (Admin › Infos & sponsors › « sur les scènes »)
function goalHTML(st) {
  const g = st.goal; if (!g || !g.inScenes) return '';
  const cur = Number(g.current) || 0, tgt = Math.max(1, Number(g.target) || 1);
  return `<div class="goal"><div class="gh"><b>${KX.esc(g.label)}</b><span>${cur} <em>/ ${tgt}</em></span></div><div class="gt"><i style="width:${Math.min(100, cur / tgt * 100)}%"></i></div></div>`;
}
const team = st => [st.settings?.teamName || 'KAELYX', st.settings?.teamSub || ''].filter(Boolean).join(' ');
function tickClock() { document.querySelectorAll('[data-clock]').forEach(el => { el.innerHTML = `<b>${new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}</b>`; }); }

function render(st) {
  const sc = (st.scenes || {})[type] || {};
  const root = document.getElementById('root');
  const soc = KX.socials(st);
  const key = type + sc.title + sc.kicker;
  root.className = key !== lastKey ? 'enter' : '';
  lastKey = key;
  const socHTML = soc.map(s => `<div class="soc">${KX.icon(s.key, 20)}${KX.esc(s.handle)}</div>`).join('');
  // Filigrane : nom d'équipe répété (deux moitiés identiques pour une boucle sans à-coup)
  const word = KX.esc(team(st));
  const half = Array.from({ length: 4 }, () => `<span>${word}</span>`).join('');
  document.getElementById('ghost').innerHTML = half + half;
  const logoSrc = (st.settings?.logo || '/logo/logo.svg').replace(/"/g, '');
  const clock = `<span class="clock"><i></i><span data-clock></span></span>`;

  document.body.classList.toggle('chatting', type === 'chatting');
  if (type === 'chatting') {
    document.querySelector('.halo').style.setProperty('--hx', '1600px');
    const liveChat = sc.chat !== false; // chat Twitch dans le cadre, sinon zone transparente pour une autre source
    KX.holeMask(document.getElementById('bg'), 1920, 1080, [
      KX.chamferPts(CAM.x, CAM.y, CAM.w, CAM.h, 0),
      ...(liveChat ? [] : [KX.chamferPts(CHAT.x, CHAT.y, CHAT.w, CHAT.h, 0)])
    ]);
    root.innerHTML = `
      <div class="chat-head">${KX.logo(st)}<div class="claws" style="--h:44px"><i></i><i></i><i></i></div>
        <div><div class="t-label">${KX.esc(sc.kicker)}</div><h1 class="t-title">${KX.esc(sc.title)}</h1></div></div>
      <div class="chat-top">${clock}</div>
      <div class="chat-cam" style="left:${CAM.x}px;top:${CAM.y}px;width:${CAM.w}px;height:${CAM.h}px">${KX.frame(CAM.w, CAM.h, 56, { border: 4 })}
        <span class="tab" style="right:28px;bottom:-17px"><i></i>En direct</span></div>
      <div class="chat-box" style="left:${CHAT.x}px;top:${CHAT.y}px;width:${CHAT.w}px;height:${CHAT.h}px">${liveChat ? '<div class="panel"></div><iframe src="/chat?embed=1" scrolling="no" title="Chat"></iframe>' : ''}${KX.frame(CHAT.w, CHAT.h, 32, { brackets: false })}
        <span class="tab" style="left:22px;top:-17px">${KX.icon('twitch', 16)}Chat</span></div>
      <div class="socials" style="position:absolute;left:${CAM.x}px;top:${CAM.y + CAM.h + 44}px">${socHTML}</div>`;
  } else {
    root.innerHTML = `
      <div class="top"><div class="claws"><i></i><i></i><i></i></div><span class="t-label">${KX.esc(st.settings?.teamName || 'KAELYX')} <em>${KX.esc(st.settings?.teamSub || '')}</em></span>
        <i class="top-line"></i>${clock}</div>
      <div class="mark"><div class="glow"></div>
        <svg class="dial" viewBox="0 0 820 820" aria-hidden="true">
          <circle cx="410" cy="410" r="404" stroke="rgba(201,204,209,.12)" stroke-width="1"/>
          <circle cx="410" cy="410" r="396" stroke="rgba(201,204,209,.22)" stroke-width="10" stroke-dasharray="1.5 18.24"/>
          <circle cx="410" cy="410" r="396" stroke="rgba(153,51,204,.75)" stroke-width="10" stroke-dasharray="1.5 98.66" stroke-dashoffset="-6"/>
        </svg>
        <div class="inner"><i></i><i></i><i></i><i></i></div>
        <div class="spin"><div class="ring"></div></div>
        <svg class="neon-ring" viewBox="0 0 620 620" aria-hidden="true"><g class="kx-neon-run">
          <circle class="halo" cx="310" cy="310" r="309" pathLength="1000" stroke-width="8"/><circle class="core" cx="310" cy="310" r="309" pathLength="1000" stroke-width="2"/>
          <circle class="halo b" cx="310" cy="310" r="309" pathLength="1000" stroke-width="8"/><circle class="core b" cx="310" cy="310" r="309" pathLength="1000" stroke-width="2"/>
        </g></svg>
        <div class="lg">${KX.logo(st, 'logo')}<div class="glint" style="-webkit-mask-image:url(&quot;${KX.esc(logoSrc)}&quot;);mask-image:url(&quot;${KX.esc(logoSrc)}&quot;)"></div></div></div>
      <div class="copy">
        <div class="kicker"><div class="claws"><i></i><i></i><i></i></div><span class="t-label">${KX.esc(sc.kicker)}</span></div>
        <h1 class="title t-title">${titleHTML(sc.title || '')}</h1>
        ${sc.subtitle ? `<p class="sub">${KX.esc(sc.subtitle)}</p>` : '<div></div>'}
        <div class="count" id="count"></div>
        <div>
          ${sc.next ? `<div class="next"><b>À suivre<em>»</em></b><span>${KX.esc(sc.next)}</span></div>` : ''}
          <div class="socials">${socHTML}</div>
          ${goalHTML(st)}
        </div>
      </div>`;
    drawCount(true);
  }
  tickClock();
  const tf = document.getElementById('ticker');
  const showT = st.ticker?.visible && type !== 'chatting';
  if (showT && !tf.src) tf.src = '/ticker?embed=1';
  tf.style.display = showT ? 'block' : 'none';
}

// Compte à rebours : lit endAt en direct ; seuls les chiffres qui changent sont animés
const DONE_LABEL = { starting: "C'est parti !", brb: 'On revient !', tech: 'On revient !', ending: 'À bientôt !' };
let shown = '';
// Chiffre « split-flap » : la moitié haute de l'ancien chiffre bascule, la moitié basse du nouveau retombe
const digitHTML = v => `<div class="digit" data-v="${v}"><span class="h up"><b>${v}</b></span><span class="h dn"><b>${v}</b></span><span class="h fu"><b>${v}</b></span><span class="h fd"><b>${v}</b></span></div>`;
function setDigit(el, v) {
  const old = el.dataset.v; if (old === v) return;
  el.dataset.v = v;
  const q = c => el.querySelector(c + ' b');
  q('.up').textContent = v; q('.dn').textContent = old; q('.fu').textContent = old; q('.fd').textContent = v;
  el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip');
  clearTimeout(el._t); el._t = setTimeout(() => { q('.dn').textContent = v; q('.fu').textContent = v; el.classList.remove('flip'); }, 660);
}
function drawCount(force) {
  const box = document.getElementById('count');
  if (!box) return;
  const sc = KX.state?.scenes?.[type] || {};
  const end = sc.endAt || 0;
  const left = Math.max(0, Math.round((end - Date.now()) / 1000));
  if (!end) { box.innerHTML = ''; box.style.display = 'none'; box.classList.remove('final'); shown = ''; silk.speed(1); silk.strength(SILK_BASE); return; }
  box.style.display = 'flex';
  if (!left) {
    if (!box.dataset.done) {
      box.dataset.done = '1'; shown = ''; box.classList.remove('final');
      box.innerHTML = `<div class="done t-title">${DONE_LABEL[type] || 'On arrive !'}</div>`;
      silk.speed(1.4); silk.strength(SILK_BASE + .25); setTimeout(() => { silk.speed(1); silk.strength(SILK_BASE); }, 6000);
    }
    return;
  }
  const mm = String(Math.min(99, Math.floor(left / 60))).padStart(2, '0'), ss = String(left % 60).padStart(2, '0');
  const charge = Math.max(0, Math.min(1, (60 - left) / 60));
  silk.speed(1 + charge * 2.2); silk.strength(SILK_BASE + charge * .5);
  box.classList.toggle('final', left <= 10);
  const total = Math.max(1, (end - (sc.startAt || end - left * 1000)) / 1000);
  const pct = Math.max(0, Math.min(100, left / total * 100));
  if (force || box.dataset.done || !box.querySelector('.cd')) {
    delete box.dataset.done; shown = '';
    const grp = (a, l) => `<div class="cd-grp"><div class="digits">${digitHTML(a[0])}${digitHTML(a[1])}</div><span class="cd-l">${l}</span></div>`;
    box.innerHTML = `<div class="cd">${grp(mm, 'MIN')}<span class="colon"><i></i><i></i></span>${grp(ss, 'SEC')}</div><div class="cd-bar"><i style="width:${pct}%"></i></div>`;
    shown = mm + ss;
    return;
  }
  const now = mm + ss;
  box.querySelectorAll('.digit').forEach((d, i) => setDigit(d, now[i]));
  shown = now;
  box.querySelector('.cd-bar i').style.width = pct + '%';
}
setInterval(() => { drawCount(); tickClock(); }, 1000);
// Dans OBS : la scène se reconstruit (titre lettre par lettre, logo, cadran) chaque fois qu'elle passe à l'antenne
addEventListener('obsSourceActiveChanged', e => { if (e.detail?.active && KX.state) { lastKey = ''; render(KX.state); } });
// Décor : reconstruit seulement si le texte, le logo, les réseaux, l'équipe ou le ticker changent
KX.watch(st => {
  const { endAt, startAt, ...sc } = (st.scenes || {})[type] || {};
  return [sc, st.settings?.logo, st.settings?.socials, st.settings?.teamName, st.settings?.teamSub, !!st.ticker?.visible, st.goal?.inScenes && st.goal];
}, render);
KX.watch(st => [st.scenes?.[type]?.endAt || 0, st.scenes?.[type]?.startAt || 0], () => drawCount(true));
</script>
