<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Objectif — Kaelyx</title>
<link rel="stylesheet" href="/css/kx.css">
<style>
  :root { --sw: cubic-bezier(.65, 0, .35, 1); }
  /* Barre d'objectif (en haut à gauche ; ?pos=tr|bl|br pour la déplacer) */
  .gl { position: absolute; left: 40px; top: 40px; width: 600px; filter: var(--kx-shadow); visibility: hidden; }
  .gl.pos-tr { left: auto; right: 40px; } .gl.pos-bl { top: auto; bottom: 40px; } .gl.pos-br { left: auto; right: 40px; top: auto; bottom: 40px; }
  .gl.in, .gl.out { visibility: visible; }
  .gl-top { display: flex; align-items: stretch; height: 52px; }
  .gl-lg { width: 52px; flex: none; display: grid; place-items: center; background: linear-gradient(180deg, rgba(243,241,241,.2), transparent 55%), var(--kx-grad); }
  .gl-lg img { width: 32px; height: 32px; object-fit: contain; }
  .gl-lab { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 30px 0 18px;
    background: linear-gradient(180deg, rgba(243,241,241,.07), rgba(243,241,241,0) 50%), var(--kx-panel); clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 100%, 0 100%); }
  .gl-lab b { font: italic 800 28px/1 var(--f-title); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 4px; }
  .gl-lab span { font: 800 26px/1 var(--f-title); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .gl-lab span em { font-style: normal; color: var(--kx-silver); }
  .gl-track { position: relative; height: 26px; margin-top: 6px; background: rgba(42,43,44,.92); box-shadow: inset 0 0 0 1px rgba(201,204,209,.18); overflow: hidden;
    clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
  .gl-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--kx-grad); transition: width 1.2s cubic-bezier(.16, 1, .3, 1); }
  .gl-fill::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(-66deg, rgba(243,241,241,.12) 0 6px, transparent 6px 16px); animation: hatch 1.4s linear infinite; }
  .gl-fill::after { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 4px; background: var(--kx-white); box-shadow: 0 0 14px #F3F1F1, 0 0 24px #9933CC; }
  @keyframes hatch { to { background-position: 34px 0; } }
  .gl-pct { position: absolute; right: 18px; top: 50%; margin-top: -8px; font: 800 14px/16px var(--f-body); letter-spacing: .1em; color: var(--kx-white); text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .gl-plus { position: absolute; right: 0; top: -38px; padding: 4px 10px; font: italic 800 24px/1 var(--f-title); background: var(--kx-violet); opacity: 0; clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
  .gl.gain .gl-plus { animation: plus 1.8s var(--kx-out) both; }
  .gl.gain .gl-track { animation: flash .9s var(--kx-out); }
  @keyframes plus { 0% { opacity: 0; transform: translateY(8px); } 15%, 75% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-8px); } }
  @keyframes flash { 0% { box-shadow: inset 0 0 0 2px #F3F1F1, 0 0 30px rgba(153,51,204,.9); } }
  /* Objectif atteint */
  .gl.done .gl-fill { background: linear-gradient(90deg, #9933CC, #F3F1F1); }
  .gl.done .gl-lab span { color: var(--kx-white); }
  .gl-done { display: none; margin-top: 6px; height: 34px; align-items: center; justify-content: center; gap: 10px; font: 800 14px/1 var(--f-body); letter-spacing: .24em; text-transform: uppercase;
    background: var(--kx-white); color: var(--kx-bg); clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
  .gl.done .gl-done { display: flex; animation: kx-wipe .6s var(--kx-out) backwards; }
  .gl.in .gl-top { animation: kx-wipe .6s var(--kx-out) backwards; }
  .gl.in .gl-track { animation: kx-wipe .7s var(--kx-out) .12s backwards; }
  .gl.out { animation: glOut .45s var(--sw) forwards; }
  @keyframes glOut { to { clip-path: inset(0 100% 0 0); } }
</style>
</head>
<body class="overlay">
<div class="gl" id="gl">
  <div class="gl-top"><div class="gl-lg" id="lg"></div><div class="gl-lab"><b id="lab"></b><span><i id="cur" style="font-style:normal"></i> <em>/ <i id="tgt" style="font-style:normal"></i></em></span></div></div>
  <div class="gl-track"><div class="gl-fill" id="fill"></div><span class="gl-pct" id="pct"></span></div>
  <div class="gl-done">Objectif atteint · merci !</div>
  <span class="gl-plus" id="plus"></span>
</div>
<script src="/js/kx.js"></script>
<script>
const gl = document.getElementById('gl');
const pos = new URLSearchParams(location.search).get('pos');
if (['tr', 'bl', 'br'].includes(pos)) gl.classList.add('pos-' + pos);
let shown = false, prev = null;
KX.on('state', st => {
  const g = st.goal || {}, cur = Math.max(0, Number(g.current) || 0), tgt = Math.max(1, Number(g.target) || 1);
  const lg = document.getElementById('lg'), lk = st.settings?.logo || '';
  if (lg.dataset.k !== lk) { lg.dataset.k = lk; lg.innerHTML = KX.logo(st); }
  document.getElementById('lab').textContent = g.label || 'Objectif';
  KX.roll(document.getElementById('cur'), cur, 900);
  document.getElementById('tgt').textContent = tgt;
  const pct = Math.min(100, cur / tgt * 100);
  document.getElementById('fill').style.width = pct + '%';
  document.getElementById('pct').textContent = Math.floor(pct) + ' %';
  gl.classList.toggle('done', cur >= tgt);
  if (prev !== null && cur > prev) { document.getElementById('plus').textContent = '+' + (cur - prev); gl.classList.remove('gain'); void gl.offsetWidth; gl.classList.add('gain'); }
  prev = cur;
  if (g.visible && !shown) { gl.classList.remove('out'); void gl.offsetWidth; gl.classList.add('in'); shown = true; }
  else if (!g.visible && shown) { gl.classList.remove('in'); gl.classList.add('out'); shown = false; setTimeout(() => { if (!shown) gl.classList.remove('out'); }, 500); }
});
</script>
</body>
</html>
