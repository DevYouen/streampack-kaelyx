<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>POV joueurs — Kaelyx</title>
<link rel="stylesheet" href="/css/kx.css">
<style>
  #players, #deco, #bg { position: absolute; inset: 0; }

  /* Fond animé (DA des scènes) : remplit tout ce que les POV ne couvrent pas. Percé là où une source OBS doit apparaître. */
  #bg { overflow: hidden; background: var(--kx-bg); }
  #bg { transition: opacity .6s ease, visibility 0s; }
  #bg.off { opacity: 0; visibility: hidden; transition: opacity .6s ease, visibility 0s .6s; }
  #bg .halo { position: absolute; width: 1300px; height: 1300px; border-radius: 50%; margin: -650px 0 0 -650px;
    background: radial-gradient(circle, rgba(153,51,204,.40) 0%, rgba(86,28,115,.30) 30%, rgba(86,28,115,0) 64%); }
  #bg .halo.a { left: 1500px; top: 300px; animation: povHaloA 26s ease-in-out infinite, kx-pulse 8s ease-in-out infinite; }
  #bg .halo.b { left: 380px; top: 820px; opacity: .75; animation: povHaloB 32s ease-in-out infinite, kx-pulse 11s ease-in-out infinite; }
  @keyframes povHaloA { 50% { left: 1180px; top: 640px; } }
  @keyframes povHaloB { 50% { left: 720px; top: 420px; } }
  #bg .grid-bg { position: absolute; inset: 0; opacity: .55;
    background-image: linear-gradient(rgba(201,204,209,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(201,204,209,.05) 1px, transparent 1px);
    background-size: 80px 80px; animation: povGrid 40s linear infinite;
    -webkit-mask-image: radial-gradient(ellipse 80% 85% at 50% 50%, #000, transparent); mask-image: radial-gradient(ellipse 80% 85% at 50% 50%, #000, transparent); }
  @keyframes povGrid { to { background-position: 80px 80px; } }
  #bg canvas { position: absolute; inset: 0; opacity: .6; }
  #bg .band { position: absolute; width: 170px; height: 1800px; top: -360px; background: var(--kx-grad); transform: rotate(24deg); opacity: .85; overflow: hidden; }
  #bg .band.thin { width: 22px; opacity: .5; }
  #bg .band::after { content: ''; position: absolute; left: 0; right: 0; height: 260px; top: -300px;
    background: linear-gradient(transparent, rgba(243,241,241,.55), transparent); animation: povSheen 6s ease-in-out infinite; }
  #bg .band.thin::after { animation-delay: 1.2s; }
  #bg .band.l::after { animation-delay: 3s; }
  @keyframes povSheen { 0%, 35% { top: -300px; } 85%, 100% { top: 1900px; } }
  #bg .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 115% 95% at 50% 50%, rgba(42,43,44,0) 55%, rgba(42,43,44,.85) 100%); }
  #bg .mark { position: absolute; left: 50%; top: 50%; width: 560px; height: 560px; margin: -280px 0 0 -280px; opacity: .07; }
  #bg .mark img { width: 100%; height: 100%; object-fit: contain; animation: povFloat 9s ease-in-out infinite; }
  @keyframes povFloat { 50% { transform: translateY(-14px) scale(1.02); } }
  #bg .band.hair { width: 4px; opacity: .45; background: var(--kx-silver); }
  #bg .ghost { position: absolute; left: 0; bottom: 14px; display: flex; white-space: nowrap; animation: povGhost 100s linear infinite; }
  #bg .ghost span { font: italic 900 240px/1 var(--f-title); text-transform: uppercase; letter-spacing: .02em; padding-right: 80px; color: transparent; -webkit-text-stroke: 2px rgba(201,204,209,.07); }
  @keyframes povGhost { to { transform: translateX(-50%); } }
  #bg .dial { position: absolute; left: 50%; top: 50%; width: 760px; height: 760px; margin: -380px 0 0 -380px; overflow: visible; opacity: .8; animation: kx-spin 120s linear infinite reverse; }
  #bg .dial circle { fill: none; }
  #bg .corner { position: absolute; width: 46px; height: 46px; border: 0 solid rgba(201,204,209,.35); }
  #bg .corner.tl { left: 36px; top: 36px; border-width: 2px 0 0 2px; } #bg .corner.tr { right: 36px; top: 36px; border-width: 2px 2px 0 0; }
  #bg .corner.bl { left: 36px; bottom: 36px; border-width: 0 0 2px 2px; } #bg .corner.br { right: 36px; bottom: 36px; border-width: 0 2px 2px 0; }
  #deco { pointer-events: none; }

  /* ---------- Transitions ---------- */
  @property --c { syntax: '<length>'; inherits: false; initial-value: 0px; }
  :root { --pv-ease: cubic-bezier(.77, 0, .18, 1); --pv-t: .75s; }

  /* Lecteur (Twitch ou VDO.Ninja) : tourne à 1280 × 720 (Twitch refuse les lecteurs < 400 × 300), réduit à la taille du cadre.
     Quand un joueur change de place, il glisse vers sa nouvelle position (le lecteur n'est jamais rechargé). */
  .pv { position: absolute; overflow: hidden; background: #000;
    clip-path: polygon(var(--c) 0, 100% 0, 100% calc(100% - var(--c)), calc(100% - var(--c)) 100%, 0 100%, 0 var(--c));
    transition: left var(--pv-t) var(--pv-ease), top var(--pv-t) var(--pv-ease), width var(--pv-t) var(--pv-ease), height var(--pv-t) var(--pv-ease), --c var(--pv-t) var(--pv-ease); }
  .pv .inner { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: center; transition: transform var(--pv-t) var(--pv-ease); }
  .pv .inner iframe { width: 100%; height: 100%; border: 0; display: block; }
  .pv.off { visibility: hidden; left: -4000px !important; transition: none; }
  .pv.noanim, .pv.noanim .inner, .instant .pv, .instant .pv .inner { transition: none !important; }
  .pv.pop { animation: pvPop .8s var(--kx-out) both; }
  .pv.leave { animation: pvLeave .4s cubic-bezier(.55, 0, .9, .4) both; }
  @keyframes pvPop { from { opacity: 0; transform: scale(1.03); } to { opacity: 1; transform: none; } }
  @keyframes pvLeave { to { opacity: 0; transform: scale(.98); } }

  /* Habillage : entrées / sorties en cascade */
  .box.enter { animation: boxIn .7s var(--kx-out) both; }
  .box.enter.k-plate { animation: plateIn .75s var(--kx-out) both; }
  .box.enter.k-logo { animation: logoIn .7s var(--kx-out) both; }
  .box.leave { animation: boxOut .4s cubic-bezier(.55, 0, .9, .4) both; }
  .box.leave.k-plate { animation: plateOut .4s cubic-bezier(.55, 0, .9, .4) both; }
  @keyframes boxIn { from { opacity: 0; transform: scale(1.05); } }
  @keyframes boxOut { to { opacity: 0; transform: scale(.95); } }
  @keyframes plateIn { 0% { clip-path: inset(0 100% 0 0); transform: translateX(-40px); } 100% { clip-path: inset(0 -40px -40px 0); transform: none; } }
  @keyframes plateOut { 0% { clip-path: inset(0 -40px -40px 0); } 100% { clip-path: inset(0 0 0 100%); transform: translateX(40px); } }
  @keyframes logoIn { from { opacity: 0; transform: translateY(14px); } }
  /* Flash néon sur le cadre quand le joueur d'une POV change */
  .box.flash::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 0 3px #F3F1F1; animation: boxFlash .5s ease-out both; }
  @keyframes boxFlash { 0% { opacity: 0; } 20% { opacity: .9; } 100% { opacity: 0; } }
  #players, #deco { transition: opacity .35s ease; }
  .fading #players, .fading #deco { opacity: 0; transition: opacity .28s ease; }

  /* Transitions logo et bande oblique : /js/kx-sting.js (partagé avec l'overlay /stinger) */

  .box { position: absolute; }
  .hint { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 12px;
    font: 600 22px/1.3 var(--f-body); color: var(--kx-silver); letter-spacing: .04em; }
  .hint.empty { border: 3px dashed rgba(201, 204, 209, .35); }
  .hint b { display: block; font: italic 800 34px/1 var(--f-title); text-transform: uppercase; color: var(--kx-white); margin-bottom: 6px; }

  /* Plaque joueur : dessinée à 72 px de haut puis mise à l'échelle de sa boîte */
  .plate { position: absolute; left: 0; top: 0; display: flex; height: 72px; transform-origin: 0 0; filter: var(--kx-shadow); }
  .pl-logo { position: relative; width: 72px; flex: none; display: grid; place-items: center; overflow: hidden;
    background: linear-gradient(180deg, rgba(243,241,241,.22), transparent 55%), var(--kx-grad); box-shadow: inset 0 0 0 1px rgba(243,241,241,.18); }
  .pl-logo img { position: relative; width: 44px; height: 44px; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,.35)); }
  @keyframes plGlint { 0% { background-position: 130% 0; } 10%, 100% { background-position: -30% 0; } }
  .pl-main { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 5px; padding: 0 30px 0 20px;
    background: linear-gradient(180deg, rgba(243,241,241,.08), rgba(243,241,241,0) 45%),
      repeating-linear-gradient(-66deg, rgba(153,51,204,.10) 0 2px, transparent 2px 9px) right / 34% 100% no-repeat, var(--kx-panel);
    box-shadow: inset 0 -3px 0 var(--kx-violet), inset 0 1px 0 rgba(243,241,241,.1); clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 100%, 0 100%); }
  .pl-cap { display: flex; gap: 5px; align-items: stretch; margin-left: -6px; padding: 10px 0; transform: skewX(-12deg); }
  .pl-cap i { display: block; width: 6px; background: var(--kx-violet); }
  .pl-cap i:nth-child(2) { opacity: .6; } .pl-cap i:nth-child(3) { opacity: .3; }
  .box.enter.k-plate .pl-logo { animation: plLogo .55s var(--kx-out) both; animation-delay: var(--d, 0s); }
  .box.enter.k-plate .pl-name { animation: plName .6s var(--kx-out) both; animation-delay: calc(var(--d, 0s) + .18s); }
  .box.enter.k-plate .pl-meta { animation: plName .6s var(--kx-out) both; animation-delay: calc(var(--d, 0s) + .26s); }
  .box.enter.k-plate .pl-cap i { animation: plCap .4s var(--kx-out) both; animation-delay: calc(var(--d, 0s) + .32s); }
  .box.enter.k-plate .pl-cap i:nth-child(2) { animation-delay: calc(var(--d, 0s) + .38s); } .box.enter.k-plate .pl-cap i:nth-child(3) { animation-delay: calc(var(--d, 0s) + .44s); }
  @keyframes plLogo { from { transform: translateX(-100%); } }
  @keyframes plName { from { transform: translateY(70%); opacity: 0; } }
  @keyframes plCap { from { transform: translateX(-14px); opacity: 0; } }
  .pl-name { font-size: 40px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 4px; }
  .pl-meta { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl-meta i { display: inline-block; width: 4px; height: 4px; margin: 0 10px 2px; background: var(--kx-violet); vertical-align: middle; }
  .plate.slim .pl-meta { display: none; }

  .logo-box { display: grid; place-items: center; }
  .logo-box img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 4px 18px rgba(0,0,0,.5)) drop-shadow(0 0 14px rgba(153,51,204,.35)); }
  .logo-box .glint { position: absolute; inset: 0; -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center;
    background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.9) 50%, transparent 60%) no-repeat; background-size: 300% 100%; background-position: 130% 0; animation: plGlint 14s ease-in-out 3s infinite; }

</style>
</head>
<body class="overlay">
<div id="bg" class="off">
  <div class="halo a"></div><div class="halo b"></div>
  <div class="grid-bg"></div>
  <canvas id="stars"></canvas>
  <div class="ghost" id="bgGhost"></div>
  <svg class="dial" viewBox="0 0 760 760" aria-hidden="true">
    <circle cx="380" cy="380" r="374" stroke="rgba(201,204,209,.10)" stroke-width="1"/>
    <circle cx="380" cy="380" r="366" stroke="rgba(201,204,209,.16)" stroke-width="9" stroke-dasharray="1.5 16.5"/>
    <circle cx="380" cy="380" r="366" stroke="rgba(153,51,204,.55)" stroke-width="9" stroke-dasharray="1.5 113.5"/>
    <circle cx="380" cy="380" r="300" stroke="rgba(201,204,209,.08)" stroke-width="1" stroke-dasharray="4 10"/>
  </svg>
  <div class="mark" id="bgMark"></div>
  <div class="band" style="left:1730px"></div><div class="band thin" style="left:1670px"></div><div class="band hair" style="left:1622px"></div>
  <div class="band l" style="left:20px;top:-500px"></div><div class="band thin l" style="left:220px;top:-500px"></div>
  <div class="vignette"></div>
  <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
</div>
<div id="players"></div>
<div id="deco"></div>
<script src="/js/kx.js"></script>
<script src="/js/kx-sting.js"></script>
<script>
/* Une seule source OBS « /pov » : la mise en page en direct (Admin > POV) et les joueurs affectés aux emplacements.
   /pov?layout=<id> force une mise en page (pour en mettre une par scène OBS si tu préfères). */
const FORCE = new URLSearchParams(location.search).get('layout');
const OBS = !!window.obsstudio;             // dans OBS : aucune indication d'aide à l'écran
const SHOW_HINTS = !OBS;                    // aperçu admin / navigateur : on montre les emplacements vides et les sources OBS
const pool = new Map();                     // id joueur -> { el, player, channel }
let twitchReady = null;
let gen = 0;                                // ignore les placements d'un rendu dépassé

function loadTwitch() {
  if (twitchReady) return twitchReady;
  twitchReady = new Promise(ok => {
    if (window.Twitch?.Player) return ok();
    const s = document.createElement('script');
    s.src = 'https://player.twitch.tv/js/embed/v1.js';
    s.onload = () => ok(); s.onerror = () => ok();
    document.head.appendChild(s);
  });
  return twitchReady;
}
const channelOf = p => (p.povChannel || p.twitch || '').trim().replace(/^@/, '').replace(/^https?:\/\/(www\.)?twitch\.tv\//i, '').split(/[/?#]/)[0].toLowerCase();
const isFull = i => i.x <= 0 && i.y <= 0 && i.x + i.w >= 1920 && i.y + i.h >= 1080;
const cut = i => Math.round(Math.min(i.w, i.h) * 0.07);

// Source vidéo d'un joueur : { type: 'twitch' | 'vdo', id } — null si rien à afficher (source OBS, chaîne vide)
function sourceOf(p) {
  if (KX.mv) return null; // multivue de l'admin : pas de lecteur vidéo (ni son)
  if (p.povSource === 'vdo') return p.povVdo ? { type: 'vdo', id: p.povVdo } : null;
  if (p.povSource === 'obs') return null;
  const c = channelOf(p);
  return c ? { type: 'twitch', id: c } : null;
}
// Lecteur d'un joueur : créé une fois, puis seulement déplacé (pas de rechargement quand il change de place)
async function ensurePlayer(p, src) {
  const key = src.type + ':' + src.id;
  let e = pool.get(p.id);
  if (e && e.key === key) return e;
  if (e) { e.el.remove(); pool.delete(p.id); }
  const el = document.createElement('div');
  el.className = 'pv off';
  const inner = document.createElement('div'); inner.className = 'inner'; inner.id = 'pv-' + p.id + '-' + Date.now();
  el.appendChild(inner);
  document.getElementById('players').appendChild(el);
  e = { el, inner, key, type: src.type, player: null, frame: null, muted: true, volume: 1 };
  pool.set(p.id, e);
  if (src.type === 'vdo') {
    // VDO.Ninja : flux direct envoyé par le joueur (lien généré dans Admin > POV), sans interface
    const f = document.createElement('iframe');
    f.allow = 'autoplay; fullscreen';
    f.src = `https://vdo.ninja/?view=${encodeURIComponent(src.id)}&cleanoutput&noheader&autoplay`;
    f.onload = () => applyMute(e);
    inner.appendChild(f); e.frame = f;
    return e;
  }
  await loadTwitch();
  if (pool.get(p.id) !== e) return e; // remplacé entre-temps
  if (window.Twitch?.Player) {
    e.player = new Twitch.Player(inner.id, { channel: src.id, width: '100%', height: '100%', parent: [location.hostname], autoplay: true, muted: true });
    e.player.addEventListener(Twitch.Player.READY, () => applyMute(e));
  } else {
    inner.innerHTML = `<iframe src="https://player.twitch.tv/?channel=${encodeURIComponent(src.id)}&parent=${location.hostname}&muted=true&autoplay=true" allow="autoplay; fullscreen"></iframe>`;
  }
  return e;
}
// Son d'une POV : coupé ou non, et volume du joueur (Admin > POV > Volumes)
function applyMute(e) {
  const off = e.muted || e.volume <= 0;
  try {
    if (e.type === 'vdo') { const w = e.frame?.contentWindow; w?.postMessage({ mute: off }, '*'); if (!off) w?.postMessage({ volume: e.volume }, '*'); } // API iframe de VDO.Ninja
    else { e.player?.setMuted(off); if (!off) e.player?.setVolume(e.volume); }
  } catch {}
}
function setMuted(e, muted, volume = e.volume) {
  if (e.muted === muted && e.volume === volume) return;
  e.muted = muted; e.volume = volume; applyMute(e);
}

const decoEls = new Map();   // clé élément -> { el, geo, content, html, pid }
let rendered = null;        // mise en page affichée ('-' si rien), null avant le premier rendu
let renderedSlots = '';     // joueurs affichés sur les POV de cette mise en page
// Joueurs réellement visibles dans la mise en page (les emplacements au-delà ne comptent pas)
const slotsKey = (pv, layout) => {
  const n = Math.max(0, ...((layout && layout.items) || []).filter(i => i.kind === 'pov' || i.kind === 'plate').map(i => i.slot + 1));
  return JSON.stringify((pv.slots || []).slice(0, n).map(x => x || ''));
};
let lastSt = null, holding = false;
const later = (fn, ms) => setTimeout(fn, ms);
const nextFrame = fn => requestAnimationFrame(() => requestAnimationFrame(fn));

// Point d'entrée : décide de la transition (balayage, fondu ou aucune) quand la mise en page en direct change
function render(st) {
  lastSt = st;
  if (holding) return; // une transition est en cours : elle appliquera le dernier état au bon moment
  const pv = st.pov || {};
  const layout = (pv.layouts || []).find(l => l.id === (FORCE || pv.live)) || (pv.layouts || [])[0];
  const sig = pv.visible !== false && layout ? layout.id : '-';
  const mode = pv.transition || 'logo';
  // Clic sur un joueur (« Mettre en grand ») : même animation logo, la mise en page reste la même
  const swap = mode === 'logo' && rendered !== null && rendered !== '-' && sig === rendered && slotsKey(pv, layout) !== renderedSlots;
  if (swap || (rendered !== null && rendered !== '-' && sig !== '-' && sig !== rendered && mode !== 'none')) {
    holding = true;
    if (mode === 'logo') {
      playSting(st);
      later(() => { holding = false; apply(lastSt, { instant: true, delay: 1.05 }); }, 1000); // écran couvert (≈ 0,42 → 2,2 s) : on change tout
    } else if (mode === 'sweep') {
      sting.play('sweep', st);
      later(() => { holding = false; apply(lastSt, { instant: true, delay: .2 }); }, 450); // écran couvert ≈ 0,34 → 0,66 s
    } else { // fondu
      document.body.classList.add('fading');
      later(() => { holding = false; apply(lastSt, { instant: true, delay: .05 }); document.body.classList.remove('fading'); }, 300);
    }
    return;
  }
  apply(st, { delay: rendered === null ? .15 : 0 });
}

// Transition logo « broadcast » (aussi déclenchable à la main depuis Admin > POV) : voir /js/kx-sting.js
const sting = KXSting.mount(document.body);
function playSting(st) { sting.play('logo', st || lastSt); }
KX.on('trigger', t => { if (t && t.kind === 'pov-sting') playSting(); });

function leave(el) {
  el.classList.remove('enter', 'flash'); el.classList.add('leave');
  later(() => el.remove(), 420);
}

function apply(st, { instant = false, delay = 0 } = {}) {
  const pv = st.pov || {};
  const layout = (pv.layouts || []).find(l => l.id === (FORCE || pv.live)) || (pv.layouts || [])[0];
  const deco = document.getElementById('deco');
  const players = st.players || [];
  const bySlot = s => players.find(p => p.id === (pv.slots || [])[s]);
  const items = pv.visible === false || !layout ? [] : layout.items;
  rendered = pv.visible !== false && layout ? layout.id : '-';
  renderedSlots = slotsKey(pv, layout);
  if (instant) { document.body.classList.add('instant'); nextFrame(() => document.body.classList.remove('instant')); }

  // 1. Lecteurs : glissent vers leur POV ; apparition « pop », disparition animée ; les joueurs encore affectés restent prêts
  const g = ++gen;
  const placed = new Set();
  const wanted = new Set((pv.slots || []).filter(Boolean));
  items.filter(i => i.kind === 'pov').forEach((i, n) => {
    const p = bySlot(i.slot);
    if (!p || placed.has(p.id)) return;
    const src = sourceOf(p);
    if (!src) return;
    placed.add(p.id);
    ensurePlayer(p, src).then(e => {
      if (g !== gen) return;
      const wasHidden = e.el.classList.contains('off') || e.el.classList.contains('leave');
      clearTimeout(e.hideT);
      if (wasHidden) e.el.classList.add('noanim');
      e.el.classList.remove('off', 'leave');
      Object.assign(e.el.style, { left: i.x + 'px', top: i.y + 'px', width: i.w + 'px', height: i.h + 'px', zIndex: isFull(i) ? 1 : 2 });
      e.el.style.setProperty('--c', (isFull(i) ? 0 : cut(i)) + 'px');
      e.inner.style.transform = `translate(-50%, -50%) scale(${Math.max(i.w / 1280, i.h / 720)})`;
      if (wasHidden) {
        void e.el.offsetWidth;
        e.el.classList.remove('noanim', 'pop');
        e.el.style.animationDelay = (delay + n * .08) + 's';
        void e.el.offsetWidth; e.el.classList.add('pop');
      }
      setMuted(e, pv.audio === 'none' || (pv.audio === 'main' && i.slot !== 0) || !!p.povMute, Math.max(0, Math.min(100, Number(p.povVolume ?? 100))) / 100);
    });
  });
  for (const [id, e] of pool) {
    if (placed.has(id)) continue;
    if (!wanted.has(id)) { // plus affecté : sortie animée puis on libère le lecteur
      pool.delete(id);
      if (instant) e.el.remove(); else { e.el.classList.add('leave'); later(() => e.el.remove(), 420); }
      continue;
    }
    setMuted(e, true);
    if (e.el.classList.contains('off') || e.el.classList.contains('leave')) continue;
    if (instant) e.el.classList.add('off');
    else {
      e.el.classList.remove('pop'); e.el.style.animationDelay = '0s'; e.el.classList.add('leave');
      e.hideT = later(() => { e.el.classList.remove('leave'); e.el.classList.add('off'); }, 420);
    }
  }

  // Fond animé : percé (clip-path evenodd) sur les POV « Source OBS » et les cadres Cam, pour laisser voir la capture OBS dessous
  const bg = document.getElementById('bg');
  const on = items.length > 0 && layout.bg !== false;
  bg.classList.toggle('off', !on);
  if (on) {
    // Masque SVG (blanc = fond visible, noir = trou) : deux trous qui se chevauchent restent des trous
    const holes = items.filter(i => i.kind === 'cam' || (i.kind === 'pov' && bySlot(i.slot)?.povSource === 'obs'))
      .map(i => `<rect x="${i.x}" y="${i.y}" width="${i.w}" height="${i.h}" fill="black"/>`).join('');
    const mask = holes ? `url("data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><defs><mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><rect width="1920" height="1080" fill="white"/>${holes}</mask></defs><rect width="1920" height="1080" mask="url(#m)"/></svg>`)}")` : '';
    bg.style.webkitMaskImage = bg.style.maskImage = mask;
    bg.style.webkitMaskSize = bg.style.maskSize = mask ? '1920px 1080px' : '';
    const mark = document.getElementById('bgMark'), logoKey = st.settings?.logo || '';
    if (mark.dataset.k !== logoKey) { mark.dataset.k = logoKey; mark.innerHTML = KX.logo(st); }
    const gh = document.getElementById('bgGhost'), word = [st.settings?.teamName || 'KAELYX', st.settings?.teamSub || ''].filter(Boolean).join(' ');
    if (gh.dataset.k !== word) { gh.dataset.k = word; const half = Array.from({ length: 4 }, () => `<span>${KX.esc(word)}</span>`).join(''); gh.innerHTML = half + half; }
  }

  // 2. Habillage : un élément par entrée de la mise en page, gardé tant que son contenu ne change pas
  //    (pas de clignotement pendant l'édition), remplacé avec une sortie / entrée animée sinon.
  const next = new Map();
  items.forEach((i, n) => {
    const d = decoOf(i, bySlot(i.slot), st);
    if (!d) return;
    const key = layout.id + ':' + i.id;
    const geo = [i.x, i.y, i.w, i.h].join();
    const cur = decoEls.get(key);
    if (cur && cur.content === d.content) {
      if (cur.geo !== geo || cur.html !== d.html) { cur.el.style.cssText = d.style; cur.el.innerHTML = d.html; cur.geo = geo; cur.html = d.html; }
      if (i.kind === 'pov' && cur.pid !== d.pid && !instant) { cur.el.classList.remove('flash'); void cur.el.offsetWidth; cur.el.classList.add('flash'); }
      cur.pid = d.pid;
      next.set(key, cur);
      return;
    }
    if (cur) leave(cur.el);
    const el = document.createElement('div');
    el.className = `box k-${i.kind} ${d.cls || ''} enter`;
    el.style.cssText = d.style;
    el.style.animationDelay = (delay + (cur ? .22 : 0) + n * .06) + 's'; // la nouvelle plaque entre pendant que l'ancienne sort
    el.style.setProperty('--d', el.style.animationDelay); // repris par les éléments internes (plaque en trois temps, balayage)
    el.innerHTML = d.html;
    deco.appendChild(el);
    next.set(key, { el, geo, content: d.content, html: d.html, pid: d.pid });
  });
  for (const [k, c] of decoEls) if (!next.has(k)) { if (instant) c.el.remove(); else leave(c.el); }
  decoEls.clear();
  for (const [k, v] of next) decoEls.set(k, v);
}

// Contenu d'un élément d'habillage. « content » décide s'il faut le rejouer en animation quand il change.
function decoOf(i, p, st) {
  const z = i.kind === 'pov' ? (isFull(i) ? 1 : 3) : i.kind === 'plate' ? 4 : i.kind === 'logo' ? 5 : 3;
  const style = `left:${i.x}px;top:${i.y}px;width:${i.w}px;height:${i.h}px;z-index:${z}`;
  if (i.kind === 'pov') {
    let hint = '', hintKey = '';
    if (SHOW_HINTS && !p) { hint = `<div class="hint empty"><div><b>POV ${i.slot + 1}</b>aucun joueur</div></div>`; hintKey = 'empty'; }
    else if (SHOW_HINTS && p.povSource === 'obs') { hint = `<div class="hint"><div><b>${KX.esc(p.pseudo)}</b>source OBS · ${i.x}, ${i.y} · ${i.w} × ${i.h}</div></div>`; hintKey = 'obs' + p.id; }
    else if (SHOW_HINTS && p.povSource === 'twitch' && !channelOf(p)) { hint = `<div class="hint empty"><div><b>${KX.esc(p.pseudo)}</b>chaîne Twitch manquante</div></div>`; hintKey = 'nochan' + p.id; }
    return { style, cls: isFull(i) ? '' : 'framed', html: (isFull(i) ? '' : KX.frame(i.w, i.h, cut(i))) + hint, content: 'pov' + isFull(i) + hintKey, pid: p?.id || '' };
  }
  if (i.kind === 'plate') {
    if (!p) return SHOW_HINTS ? { style, html: `<div class="hint empty" style="font-size:14px">Plaque POV ${i.slot + 1}</div>`, content: 'empty' } : null;
    const k = i.h / 72;
    const meta = [p.role || 'Joueur', p.game].filter(Boolean).map(KX.esc).join('<i></i>');
    const html = `<div class="plate ${i.h < 56 ? 'slim' : ''}" style="width:${i.w / k}px;transform:scale(${k})">
      <div class="pl-logo">${KX.logo(st)}</div>
      <div class="pl-main kx-neon-line bottom"><b class="pl-name t-title">${KX.esc(p.pseudo)}</b><span class="pl-meta t-label">${meta}</span></div>
      <div class="pl-cap" aria-hidden="true"><i></i><i></i><i></i></div></div>`;
    return { style, html, content: [p.id, p.pseudo, p.role, p.game, st.settings?.logo].join('|') };
  }
  if (i.kind === 'cam') return { style, html: KX.frame(i.w, i.h) + (SHOW_HINTS ? `<div class="hint"><div><b>Cam</b>source OBS · ${i.x}, ${i.y}</div></div>` : ''), content: 'cam' };
  if (i.kind === 'logo') {
    const src = (st.settings?.logo || '/logo/logo.svg').replace(/"/g, '');
    return { style, cls: 'logo-box', html: KX.logo(st) + `<i class="glint" style="-webkit-mask-image:url(&quot;${KX.esc(src)}&quot;);mask-image:url(&quot;${KX.esc(src)}&quot;)"></i>`, content: 'logo' + src };
  }
  return null;
}
KX.starfield(document.getElementById('stars'), 110);
KX.watch(st => [st.pov, (st.players || []).map(p => [p.id, p.pseudo, p.role, p.game, p.twitch, p.povSource, p.povChannel, p.povVdo, p.povVolume, p.povMute]), st.settings?.logo], render);
</script>
