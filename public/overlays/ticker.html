<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ticker — Kaelyx</title>
<link rel="stylesheet" href="/css/kx.css">
<style>
  body.embed { height: 64px; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; display: flex; transition: transform .6s var(--kx-out), opacity .4s; }
  .bar.off { transform: translateY(100%); opacity: 0; }
  .badge { position: relative; z-index: 2; flex: none; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 40px 0 28px; overflow: hidden;
    background: linear-gradient(180deg, rgba(243,241,241,.18), transparent 55%), var(--kx-grad); clip-path: polygon(0 0, 100% 0, calc(100% - 20px) 100%, 0 100%); }
  .badge::after { content: ''; position: absolute; top: 0; bottom: 0; width: 70px; left: -100px; background: linear-gradient(100deg, transparent, rgba(243,241,241,.35), transparent); animation: bShine 9s ease-in-out 3s infinite; }
  @keyframes bShine { 0%, 85% { left: -100px; } 100% { left: 110%; } }
  .badge i.live { width: 9px; height: 9px; border-radius: 50%; background: var(--kx-white); animation: live 1.6s ease-out infinite; }
  @keyframes live { 0% { box-shadow: 0 0 0 0 rgba(243,241,241,.9); } 100% { box-shadow: 0 0 0 9px rgba(243,241,241,0); } }
  .badge img { width: 34px; height: 34px; object-fit: contain; }
  .badge b { font: italic 800 28px/1 var(--f-title); letter-spacing: .03em; text-transform: uppercase; padding-right: 4px; }
  .strip { position: relative; flex: 1; margin-left: -20px; overflow: hidden; background: var(--kx-panel); box-shadow: inset 0 2px 0 var(--kx-violet); display: flex; align-items: center; }
  .strip::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 70px; z-index: 1; background: linear-gradient(90deg, rgba(42,43,44,1) 35%, rgba(42,43,44,0)); }
  .strip .fade-r { position: absolute; inset: 0 0 0 auto; width: 90px; z-index: 1; background: linear-gradient(-90deg, rgba(42,43,44,1) 20%, rgba(42,43,44,0)); }
  .item .sep { display: inline-grid; place-items: center; width: 26px; height: 26px; opacity: .85; }
  .item .sep img { width: 100%; height: 100%; object-fit: contain; }
  .item.spons img.sl { height: 34px; max-width: 160px; object-fit: contain; }
  .item.spons small { font: 800 11px/1 var(--f-body); letter-spacing: .2em; text-transform: uppercase; color: var(--kx-silver); }
  .item.goal b { font: italic 800 22px/1 var(--f-title); text-transform: uppercase; }
  .item.goal .gb { width: 140px; height: 10px; background: rgba(201,204,209,.2); clip-path: polygon(0 0, 100% 0, calc(100% - 4px) 100%, 0 100%); }
  .item.goal .gb i { display: block; height: 100%; background: var(--kx-grad); box-shadow: inset -3px 0 0 var(--kx-white); }
  /* Entrée : la bande monte, le badge se dévoile, puis le texte apparaît */
  .bar:not(.off) .badge { animation: kx-wipe .6s var(--kx-out) .1s backwards; }
  .bar:not(.off) .strip { animation: stripIn .7s var(--kx-out) .25s backwards; }
  .bar:not(.off) .track { animation-delay: 0s; }
  @keyframes stripIn { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0); } }
  .track { display: flex; flex: none; align-items: center; white-space: nowrap; will-change: transform; }
  .item { display: inline-flex; align-items: center; gap: 30px; padding-right: 30px; font: 600 21px/1 var(--f-body); color: var(--kx-white); }
  .item .k { width: 8px; height: 8px; background: var(--kx-violet); transform: rotate(45deg); }
  .item svg { color: var(--kx-violet); }
  .item em { font-style: normal; color: var(--kx-silver); }
  .grp { display: flex; flex: none; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(var(--shift)); } }
</style>
</head>
<body class="overlay">
<div class="bar off" id="bar">
  <div class="badge" id="badge"></div>
  <div class="strip kx-neon-line" style="--nh:2px;--nd:6s"><div class="track" id="track"></div><i class="fade-r"></i></div>
</div>
<script src="/js/kx.js"></script>
<script>
if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed');
KX.watch(st => !!st.ticker?.visible, st => document.getElementById('bar').classList.toggle('off', !st.ticker?.visible));
KX.watch(st => [st.settings?.logo, st.settings?.teamName], st => {
  document.getElementById('badge').innerHTML = `${KX.logo(st)}<b>${KX.esc(st.settings?.teamName)}</b><i class="live"></i>`;
});
// Défilement sans couture : un « groupe » assez long pour couvrir toute la bande, répété deux fois,
// et on décale exactement de la largeur d'un groupe (en px) pour boucler sans saut ni trou.
const track = document.getElementById('track'), strip = track.parentElement;
let html = '', speed = 60, run = 0, lastW = 0;
const messages = st => (st.ticker?.items || []).map(x => String(x).trim()).filter(Boolean);
function layout() {
  const my = ++run;
  track.style.animation = 'none';
  if (!html) { track.innerHTML = ''; return; }
  track.innerHTML = `<div class="grp">${html}</div>`;
  // Mesurer une fois les polices chargées, sinon la largeur (et donc la vitesse) est fausse
  document.fonts.ready.then(() => requestAnimationFrame(() => {
    if (my !== run) return; // une mise à jour plus récente est arrivée entre-temps
    const one = track.firstElementChild?.getBoundingClientRect().width;
    if (!one) return;
    lastW = strip.clientWidth;
    const grp = html.repeat(Math.max(1, Math.ceil(lastW / one)));
    track.innerHTML = `<div class="grp">${grp}</div><div class="grp">${grp}</div>`;
    const w = track.firstElementChild.getBoundingClientRect().width;
    track.style.setProperty('--shift', -w + 'px');
    track.style.animation = `scroll ${w / speed}s linear infinite`;
  }));
}
// La piste ne redémarre que si les messages, les réseaux ou la vitesse changent
KX.watch(st => [messages(st), KX.socials(st), st.ticker?.speed, st.settings?.logo, st.sponsors?.inTicker && st.sponsors.items, st.goal?.inTicker && st.goal], st => {
  const sep = `<span class="sep">${KX.logo(st)}</span>`; // séparateur : le logo de l'équipe
  const soc = KX.socials(st).map(s => `<span class="item">${KX.icon(s.key, 22)}<em>${KX.esc(s.handle)}</em>${sep}</span>`).join('');
  const sp = st.sponsors?.inTicker ? (st.sponsors.items || []).filter(i => i.logo || i.name).map(i => `<span class="item spons"><small>Partenaire</small>${i.logo ? `<img class="sl" src="${KX.esc(i.logo)}" alt="${KX.esc(i.name)}">` : `<em>${KX.esc(i.name)}</em>`}${sep}</span>`).join('') : '';
  const g = st.goal, gp = g ? Math.min(100, (Number(g.current) || 0) / Math.max(1, Number(g.target) || 1) * 100) : 0;
  const gl = g?.inTicker ? `<span class="item goal"><b>${KX.esc(g.label)}</b><span class="gb"><i style="width:${gp}%"></i></span><em>${Number(g.current) || 0} / ${Number(g.target) || 0}</em>${sep}</span>` : '';
  html = messages(st).map(x => `<span class="item">${KX.esc(x)}${sep}</span>`).join('') + gl + sp + soc;
  speed = Math.max(20, Number(st.ticker?.speed) || 60); // jamais figé, même pendant la saisie de la vitesse
  layout();
});
// Source OBS redimensionnée : on recalcule
let rsz;
new ResizeObserver(() => { if (html && strip.clientWidth !== lastW) { clearTimeout(rsz); rsz = setTimeout(layout, 200); } }).observe(strip);
</script>
</body>
</html>
