<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Stinger — Kaelyx</title>
<link rel="stylesheet" href="/css/kx.css">
</head>
<body class="overlay">
<script src="/js/kx.js"></script>
<script src="/js/kx-fx.js"></script>
<script src="/js/kx-sting.js"></script>
<script>
/* Stinger : même transition que les POV (/js/kx-sting.js). Durée 2,6 s, écran couvert ≈ 0,42 → 2,2 s :
   point de transition OBS 1200 ms. Déclenché depuis l'admin (bouton « Lancer le stinger » ou Ctrl + Maj + S).
   ?loop rejoue en boucle (réglages) · ?t=1200 fige l'image à 1200 ms (rendu du fichier vidéo). */
const sting = KXSting.mount(document.body);
const play = () => sting.play('logo');
KX.on('trigger', t => { if (t.kind === 'stinger') play(); });
const q = new URLSearchParams(location.search);
if (q.has('loop')) KX.on('open', () => { if (!window.kxLoop) { window.kxLoop = setInterval(play, 3600); play(); } });
if (q.has('t')) KX.on('state', st => sting.seek(Number(q.get('t')) || 0, 'logo', st));
window.kxPlay = play;
window.kxSeek = (t, st) => sting.seek(t, 'logo', st || KX.state);
</script>
</body>
</html>
