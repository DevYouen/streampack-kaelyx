<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Joueur du match — Kaelyx</title>
<link rel="stylesheet" href="/css/kx.css">
<style>
  :root { --sw: cubic-bezier(.65, 0, .35, 1); }
  /* Plein écran, transparent quand il est masqué : se pose dans n'importe quelle scène */
  .mv { position: absolute; inset: 0; visibility: hidden; }
  .mv.in, .mv.out { visibility: visible; }
  .bg { position: absolute; inset: 0; background: var(--kx-bg); overflow: hidden; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
  .silk { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0; } .silk.on { opacity: 1; }
  .band { position: absolute; width: 170px; height: 1800px; top: -360px; background: var(--kx-grad); transform: rotate(24deg); opacity: .85; }
  .band.thin { width: 22px; opacity: .5; } .band.hair { width: 4px; opacity: .45; background: var(--kx-silver); }
  .ghost { position: absolute; left: -40px; bottom: 10px; font: italic 900 300px/1 var(--f-title); text-transform: uppercase; color: transparent; -webkit-text-stroke: 2px rgba(201,204,209,.07); white-space: nowrap; }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 110% 95% at 35% 50%, rgba(42,43,44,0) 50%, rgba(42,43,44,.9) 100%); }
  /* Carte photo en 3D */
  .card { position: absolute; left: 150px; top: 170px; width: 560px; height: 700px; perspective: 1600px; }
  .card-in { position: absolute; inset: 0; transform-style: preserve-3d; animation: float 9s ease-in-out infinite; }
  .ph { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(ellipse 90% 60% at 50% 30%, rgba(153,51,204,.55), rgba(86,28,115,0) 70%), linear-gradient(180deg, var(--kx-deep), var(--kx-bg) 80%);
    clip-path: polygon(44px 0, 100% 0, 100% calc(100% - 44px), calc(100% - 44px) 100%, 0 100%, 0 44px); }
  .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .ph .ini { position: absolute; inset: 0; display: grid; place-items: center; font: italic 900 260px/1 var(--f-title); color: rgba(243,241,241,.16); }
  .ph::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: linear-gradient(0deg, rgba(42,43,44,.85), transparent); }
  .ph .glint { position: absolute; inset: 0; z-index: 2; background: linear-gradient(105deg, transparent 40%, rgba(243,241,241,.2) 50%, transparent 60%) no-repeat; background-size: 300% 100%; animation: glint 7s ease-in-out 2.5s infinite; }
  @keyframes glint { 0% { background-position: 130% 0; } 20%, 100% { background-position: -30% 0; } }
  @keyframes float { 0%, 100% { transform: rotateY(-6deg) rotateX(2deg); } 50% { transform: rotateY(6deg) rotateX(-2deg) translateY(-10px); } }
  .crown { position: absolute; left: 50%; top: -46px; width: 92px; height: 92px; margin-left: -46px; display: grid; place-items: center; background: var(--kx-white); transform: rotate(45deg); box-shadow: 0 0 40px rgba(153,51,204,.8); z-index: 3; }
  .crown svg { width: 46px; height: 46px; transform: rotate(-45deg); fill: var(--kx-violet); }
  /* Texte */
  .tx { position: absolute; left: 800px; top: 0; bottom: 0; width: 980px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .kick { display: flex; align-items: center; gap: 16px; }
  .kick span { font: 800 20px/1 var(--f-body); letter-spacing: .3em; text-transform: uppercase; color: var(--kx-white); }
  .kick img { width: 54px; height: 54px; object-fit: contain; }
  .nm { overflow: hidden; padding: 20px 14px 4px 0; margin: -20px 0 -4px; }
  .nm h1 { margin: 0; font-size: 190px; line-height: .9; white-space: nowrap; filter: drop-shadow(0 10px 30px rgba(18,18,20,.4)); }
  .role { font: 700 22px/1 var(--f-body); letter-spacing: .22em; text-transform: uppercase; color: var(--kx-silver); }
  .stats { display: flex; gap: 14px; margin-top: 14px; }
  .st { min-width: 200px; padding: 18px 24px 16px; background: linear-gradient(180deg, rgba(243,241,241,.08), rgba(243,241,241,0) 50%), rgba(42,43,44,.9); box-shadow: inset 0 -4px 0 var(--kx-violet);
    clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%, 0 14px); }
  .st b { display: block; font: 800 74px/1 var(--f-title); font-variant-numeric: tabular-nums; }
  .st small { display: block; margin-top: 8px; font: 700 14px/1 var(--f-body); letter-spacing: .22em; text-transform: uppercase; color: var(--kx-silver); }
  .st:first-child { background: var(--kx-grad); box-shadow: inset 0 -4px 0 var(--kx-white); } .st:first-child small { color: var(--kx-white); }
  /* Entrée : volet oblique, carte qui pivote, nom lettre par lettre, stats en cascade */
  .mv.in .bg { animation: bgIn .7s var(--sw) backwards; }
  .mv.in .card { animation: cardIn 1.1s var(--kx-out) .25s backwards; }
  .mv.in .crown { animation: crownIn .8s cubic-bezier(.34, 1.4, .64, 1) .9s backwards; }
  .mv.in .kick { animation: kxp-up .6s var(--kx-out) .5s backwards; }
  .mv.in .nm .kx-ch { animation: kx-chIn .8s var(--kx-out) backwards; animation-delay: calc(.6s + var(--i) * 40ms); }
  .mv.in .role { animation: kxp-up .6s var(--kx-out) .95s backwards; }
  .mv.in .st { animation: kx-wipe .6s var(--kx-out) backwards; animation-delay: calc(1.05s + var(--k) * 110ms); }
  @keyframes bgIn { from { clip-path: polygon(0 0, 0 0, -400px 100%, -400px 100%); } to { clip-path: polygon(0 0, calc(100% + 400px) 0, 100% 100%, 0 100%); } }
  @keyframes cardIn { from { opacity: 0; transform: translateX(-120px) rotateY(40deg); } }
  @keyframes crownIn { from { opacity: 0; transform: rotate(45deg) scale(.2); } }
  .mv.out { animation: mvOut .6s var(--sw) forwards; }
  @keyframes mvOut { to { clip-path: polygon(100% 0, 100% 0, 100% 100%, calc(100% + 400px) 100%); } }
</style>
</head>
<body class="overlay">
<div class="mv" id="mv">
  <div class="bg"><canvas class="silk" id="silk"></canvas><div class="ghost" id="ghost"></div>
    <div class="band" style="left:1745px"></div><div class="band thin" style="left:1688px"></div><div class="band hair" style="left:1640px"></div><div class="vignette"></div></div>
  <div class="card"><div class="card-in"><div class="ph" id="ph"></div><div class="crown"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg></div></div></div>
  <div class="tx"><div class="kick" id="kick"></div><div class="nm"><h1 class="t-title" id="nm"></h1></div><div class="role" id="role"></div><div class="stats" id="stats"></div></div>
</div>
<script src="/js/kx.js"></script>
<script src="/js/kx-fx.js"></script>
<script>
const mv = document.getElementById('mv');
const silk = KXFX.silk(document.getElementById('silk'), { focus: [.25, .5], strength: 1, paused: true });
let shown = false, key = '';
KX.on('state', st => {
  const m = st.mvp || {}, p = (st.players || []).find(x => x.id === m.player);
  const k2 = JSON.stringify([m.player, m.title, m.stats, p && [p.pseudo, p.photo, p.role, p.game], st.settings?.logo]);
  const v = !!m.visible && !!p;
  if (k2 !== key && p) {
    key = k2;
    document.getElementById('ph').innerHTML = `<span class="ini">${KX.esc(KX.initials(p.pseudo))}</span>${p.photo ? `<img src="${KX.esc(p.photo)}" alt="" onerror="this.remove()">` : ''}<i class="glint"></i>`;
    document.getElementById('kick').innerHTML = `${KX.logo(st)}<div class="claws" style="--h:30px"><i></i><i></i><i></i></div><span>${KX.esc(m.title || 'Joueur du match')}</span>`;
    document.getElementById('nm').innerHTML = KX.chars(p.pseudo);
    document.getElementById('ghost').textContent = 'MVP · MVP · MVP';
    document.getElementById('role').textContent = [p.role, p.game, (st.settings?.teamName || '') + ' ' + (st.settings?.teamSub || '')].filter(x => x && x.trim()).join(' · ');
    const stats = (m.stats || []).filter(s => s.label || s.value);
    document.getElementById('stats').innerHTML = stats.map((s, k) => `<div class="st" style="--k:${k}"><b data-v="0" data-t="${KX.esc(s.value)}">${KX.esc(s.value)}</b><small>${KX.esc(s.label)}</small></div>`).join('');
    if (shown) { mv.classList.remove('in'); void mv.offsetWidth; mv.classList.add('in'); countStats(); }
  }
  if (v && !shown) { mv.classList.remove('out'); void mv.offsetWidth; mv.classList.add('in'); shown = true; silk.play(); countStats(); }
  else if (!v && shown) { mv.classList.remove('in'); mv.classList.add('out'); shown = false; setTimeout(() => { if (!shown) { mv.classList.remove('out'); silk.pause(); } }, 650); }
});
// Les stats numériques défilent depuis 0 (« 12 », « 1 450 ») ; le texte (« Top 1 ») s'affiche tel quel
function countStats() {
  document.querySelectorAll('.st b').forEach((b, k) => {
    const t = b.dataset.t, n = Number(String(t).replace(/\s/g, ''));
    if (!t || !Number.isFinite(n) || !/^[\d\s]+$/.test(t)) { b.textContent = t; return; }
    b.dataset.v = 0; b.textContent = '0'; b._fmt = v => v.toLocaleString('fr-FR');
    setTimeout(() => KX.roll(b, n, 1100), 1100 + k * 110);
  });
}
</script>
</body>
</html>
