<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tournoi — Kaelyx</title>
<link rel="stylesheet" href="/css/kx.css">
<style>
  .bg { position: absolute; inset: 0; background: var(--kx-bg); overflow: hidden; }
  .silk { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0; transition: opacity 1.6s ease; } .silk.on { opacity: 1; }
  .band { position: absolute; width: 170px; height: 1800px; top: -360px; background: var(--kx-grad); transform: rotate(24deg); opacity: .8; }
  .band.thin { width: 22px; opacity: .45; }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 120% 95% at 50% 55%, rgba(42,43,44,0) 55%, rgba(42,43,44,.85) 100%); }
  .head { position: absolute; left: 100px; top: 64px; display: flex; align-items: center; gap: 22px; }
  .head img { width: 76px; height: 76px; object-fit: contain; filter: drop-shadow(0 0 18px rgba(153,51,204,.6)); }
  .head .mask { overflow: hidden; padding: 14px 12px 4px 0; margin: -14px 0 -4px; }
  .head h1 { margin: 0; font-size: 92px; }
  .head h1 .kx-ch { animation: kx-chIn .8s var(--kx-out) backwards; animation-delay: calc(.1s + var(--i) * 30ms); }
  #tree { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .rname { position: absolute; top: 200px; font: 800 14px/1 var(--f-body); letter-spacing: .26em; text-transform: uppercase; color: var(--kx-violet); animation: kxp-up .6s var(--kx-out) backwards; animation-delay: calc(.2s + var(--c) * .15s); }
  svg.links { position: absolute; inset: 0; overflow: visible; }
  svg.links path { fill: none; stroke: rgba(201,204,209,.28); stroke-width: 2; stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 1s var(--kx-out) forwards; animation-delay: calc(.5s + var(--c) * .15s); }
  svg.links path.win { stroke: var(--kx-violet); stroke-width: 3; filter: drop-shadow(0 0 6px rgba(153,51,204,.8)); }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  /* Match */
  .m { position: absolute; display: flex; flex-direction: column; filter: var(--kx-shadow); animation: kx-wipe .6s var(--kx-out) backwards; animation-delay: calc(.3s + var(--c) * .15s + var(--k) * 50ms); }
  .tm { display: flex; align-items: center; height: var(--rh); background: rgba(42,43,44,.95); box-shadow: inset 0 -1px 0 var(--kx-line); }
  .tm b { flex: 1; min-width: 0; padding: 0 14px; font: italic 800 calc(var(--rh) * .5)/1 var(--f-title); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tm span { width: calc(var(--rh) * 1.1); height: 100%; display: grid; place-items: center; font: 800 calc(var(--rh) * .55)/1 var(--f-title); font-variant-numeric: tabular-nums; background: var(--kx-deep); }
  .tm.tbd b { color: rgba(201,204,209,.45); font-style: normal; font-weight: 600; font-family: var(--f-body); font-size: calc(var(--rh) * .34); letter-spacing: .1em; }
  .tm.win { background: linear-gradient(90deg, rgba(86,28,115,.96), rgba(42,43,44,.96)); } .tm.win span { background: var(--kx-violet); }
  .tm.lose b { color: var(--kx-silver); opacity: .6; } .tm.lose span { background: rgba(201,204,209,.15); }
  .m.live { box-shadow: 0 0 0 2px var(--kx-white), 0 0 28px rgba(153,51,204,.7); }
  .m.live::before { content: 'En cours'; position: absolute; right: 0; top: -24px; padding: 5px 9px; font: 800 10px/1 var(--f-body); letter-spacing: .2em; text-transform: uppercase; background: var(--kx-white); color: var(--kx-bg); }
  /* Champion */
  .champ { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; animation: kxp-up .8s var(--kx-out) backwards; animation-delay: calc(.4s + var(--c) * .15s); }
  .champ .tr { width: 110px; height: 110px; display: grid; place-items: center; background: var(--kx-white); transform: rotate(45deg); box-shadow: 0 0 50px rgba(153,51,204,.7); }
  .champ .tr svg { width: 54px; height: 54px; transform: rotate(-45deg); fill: none; stroke: var(--kx-violet); stroke-width: 2; stroke-linejoin: round; }
  .champ small { font: 800 13px/1 var(--f-body); letter-spacing: .26em; text-transform: uppercase; color: var(--kx-silver); margin-top: 14px; }
  .champ b { font: italic 800 52px/1 var(--f-title); text-transform: uppercase; max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 6px; }
  .champ.empty b { color: rgba(201,204,209,.4); font-size: 34px; }
</style>
</head>
<body class="overlay">
<div class="bg"><canvas class="silk" id="silk"></canvas><div class="band" style="left:1780px"></div><div class="band thin" style="left:1722px"></div><div class="vignette"></div></div>
<div class="head" id="head"></div>
<div id="tree"></div>
<script src="/js/kx.js"></script>
<script src="/js/kx-fx.js"></script>
<script>
KXFX.silk(document.getElementById('silk'), { focus: [.5, .55], strength: .85 });
const TROPHY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3M12 14v4M8 21h8M9 18h6"/></svg>';
let key = '';
KX.on('state', st => {
  const b = st.bracket || {};
  const k2 = JSON.stringify([b, st.settings?.logo]); if (k2 === key) return; key = k2;
  document.getElementById('head').innerHTML = `${KX.logo(st)}<div class="claws" style="--h:52px"><i></i><i></i><i></i></div><div class="mask"><h1 class="t-title">${KX.chars(b.title || 'Tournoi')}</h1></div>`;
  const rounds = KX.bracket(b), R = rounds.length;
  // Mise en page : une colonne par tour + le champion ; matchs régulièrement espacés dans la hauteur
  const cols = R + 1, left = 100, right = 100, gap = 70, top = 240, H = 780;
  const w = Math.min(360, (1920 - left - right - gap * (cols - 1)) / cols);
  const rh = rounds[0].matches.length >= 8 ? 30 : rounds[0].matches.length >= 4 ? 40 : 52;
  const xOf = c => left + c * (w + gap);
  const live = rounds.flatMap(r => r.matches).find(m => !m.done && m.a && m.b);
  let html = '', paths = '';
  rounds.forEach((r, c) => {
    const n = r.matches.length;
    html += `<div class="rname" style="left:${xOf(c)}px;--c:${c}">${KX.esc(r.name)}</div>`;
    r.matches.forEach((m, k) => {
      const cy = top + (k + .5) * H / n, y = cy - rh, x = xOf(c);
      const row = (name, sc, side) => {
        const cls = !name ? 'tbd' : m.winner ? (m.winner === name ? 'win' : 'lose') : '';
        return `<div class="tm ${cls}"><b>${name ? KX.esc(name) : 'À déterminer'}</b><span>${name && (m.done || sc) ? sc : ''}</span></div>`;
      };
      html += `<div class="m ${live === m ? 'live' : ''}" style="left:${x}px;top:${y}px;width:${w}px;--rh:${rh}px;--c:${c};--k:${k}">${row(m.a, m.sa, 'a')}${row(m.b, m.sb, 'b')}</div>`;
      // Liaison vers le match suivant (ou vers le champion)
      const nx = c + 1 < R ? { x: xOf(c + 1), y: top + (Math.floor(k / 2) + .5) * H / (n / 2) } : { x: xOf(c + 1), y: top + H / 2 };
      const mid = x + w + gap / 2;
      paths += `<path class="${m.winner ? 'win' : ''}" style="--c:${c}" d="M${x + w} ${cy}H${mid}V${nx.y}H${nx.x}"/>`;
    });
  });
  const champ = rounds[R - 1].matches[0].winner;
  html += `<div class="champ ${champ ? '' : 'empty'}" style="left:${xOf(R)}px;top:${top + H / 2 - 90}px;width:${w}px;--c:${R}"><div class="tr">${TROPHY}</div><small>Vainqueur</small><b>${champ ? KX.esc(champ) : 'À venir'}</b></div>`;
  document.getElementById('tree').innerHTML = `<svg class="links" viewBox="0 0 1920 1080" aria-hidden="true">${paths}</svg>` + html;
});
</script>
</body>
</html>
