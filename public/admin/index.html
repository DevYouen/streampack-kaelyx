<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Streampack Kaelyx</title>
<link rel="icon" href="/logo/logo.svg">
<link rel="stylesheet" href="/css/kx.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="brand" href="/" aria-label="Accueil du streampack">
      <img src="/logo/logo.svg" alt="" id="brandLogo">
      <span><b>Kaelyx</b><small>Streampack</small></span>
    </a>
    <nav class="nav" id="nav" aria-label="Sections">
      <button type="button" data-tab="players"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.7.8 2.7 2.5 3 5.2"/></svg>Joueurs</button>
      <button type="button" data-tab="scenes"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="1"/><path d="M8 21h8M12 17v4"/></svg>Scènes</button>
      <button type="button" data-tab="casters"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="13" height="12" rx="1"/><path d="m15.5 10 6-3.5v11l-6-3.5"/></svg>Cam &amp; casters</button>
      <button type="button" data-tab="lowerthird"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15h13l-2 4H3zM5 10h10"/></svg>Lower third</button>
      <button type="button" data-tab="ticker"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18M15 6l6 6-6 6"/></svg>Ticker</button>
      <button type="button" data-tab="scoreboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Scoreboard</button>
      <button type="button" data-tab="alerts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Alertes &amp; stinger</button>
      <button type="button" data-tab="twitch"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h15v10l-4 4h-4l-3 3H7v-3H4V6zM11 8v4M15 8v4"/></svg>Twitch</button>
      <button type="button" data-tab="links"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Liens OBS</button>
      <button type="button" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Réglages</button>
    </nav>
    <div class="status" id="status" role="status"><i></i><span>Connexion…</span></div>
  </aside>

  <main class="main" id="main"></main>

  <section class="preview" aria-label="Aperçu en direct">
    <div class="pv-head">
      <span class="pv-title">Aperçu en direct</span>
      <code id="pvUrl"></code>
    </div>
    <div class="pv-screen" id="pvScreen"><iframe id="pvFrame" title="Aperçu de l'overlay" scrolling="no"></iframe></div>
    <div class="pv-actions">
      <button type="button" class="btn ghost" data-act="copy" id="pvCopy">Copier l'URL</button>
      <a class="btn ghost" id="pvOpen" target="_blank" rel="noopener">Ouvrir dans un onglet</a>
      <button type="button" class="btn ghost" data-act="reload-preview">Recharger</button>
    </div>
  </section>
</div>
<datalist id="photoList"></datalist>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/js/kx.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
